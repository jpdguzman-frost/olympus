<script id="tpl-lead" type="text/ractive">
  <header class="topbar">
    <div class="topbar-inner">
      <span class="wordmark">OLYMPUS <span class="sub">· TEAM</span></span>
      <span class="topbar-spacer"></span>
      {{#if me}}
        <span class="whoami">
          {{me.name}}
          {{#each me.roles}}<span class="role-chip">{{this}}</span>{{/each}}
        </span>
        {{#if isTalent}}<a href="/">My record</a>{{/if}}
        {{#if isAdmin}}<a href="/admin.html">Admin</a>{{/if}}
        <button class="linkish" on-click="@this.logout()">Sign out</button>
      {{/if}}
    </div>
  </header>
  <main class="wrap">
    {{#if error}}<div class="error-note">{{error}}</div>{{/if}}
    {{#if notice}}<div class="banner banner-safe">{{notice}}</div>{{/if}}

    <div class="capture-head"><h1>Your team's evidence</h1></div>

    <div class="banner banner-info" style="margin-bottom: 1rem;">
      This page is read-only. Picks are checked from the main app by whoever JP set as the checker;
      reviewers write their own verdicts. You see your people's confirmed records here — counts only, never a ranking.
    </div>

    <section>
      <div class="section-label">Reports <span class="count">{{reports.length}}</span></div>
      {{#if reports.length}}
        {{#each reports}}
          <article class="record">
            <div class="record-head"><span class="record-subject">{{.name}}</span></div>
            <div class="record-meta"><span class="tag">{{.track}}</span><span>{{.email}}</span></div>
          </article>
        {{/each}}
      {{else}}
        <div class="empty-state">No reports are assigned to you yet.</div>
      {{/if}}
    </section>

    <section>
      <div class="section-label">Confirmed records <span class="count">{{cards.length}}</span></div>
      {{#if cards.length}}
        {{#each cards}}
          <article class="record">
            <div class="record-head"><span class="record-subject">{{.subject.name}}</span></div>
            <div class="record-meta">
              <span class="tag">{{.periodTag}}</span>
              <span>{{.claims.length}} claims</span>
            </div>
            <span class="stamp stamp-confirmed">Confirmed</span>
          </article>
        {{/each}}
      {{else}}
        <div class="empty-state">
          Confirmed cards from your people show here. Counts only. Never a ranking.
        </div>
      {{/if}}
    </section>
  </main>
</script>
