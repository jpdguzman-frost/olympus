<script id="tpl-lead" type="text/ractive">
  <header class="topbar">
    <div class="topbar-inner">
      <span class="wordmark">OLYMPUS <span class="sub">· TEAM</span></span>
      <span class="topbar-spacer"></span>
      {{#if me}}
        <span class="whoami">
          {{me.name}}
          {{#each me.roles}}<span class="role-chip">{{this}}</span>{{/each}}
        </span>
        {{#if isTalent}}<a href="/">My record</a>{{/if}}
        {{#if isAdmin}}<a href="/admin.html">Admin</a>{{/if}}
        <button class="linkish" on-click="@this.logout()">Sign out</button>
      {{/if}}
    </div>
  </header>
  <main class="wrap">
    {{#if error}}<div class="error-note">{{error}}</div>{{/if}}
    {{#if notice}}<div class="banner banner-safe">{{notice}}</div>{{/if}}

    <div class="capture-head"><h1>Your team's evidence</h1></div>

    <section>
      <div class="section-label">Open a card shell</div>
      <div class="shell-form">
        <div class="form-row">
          <label class="field">
            <span class="field-name">Report</span>
            <select value="{{shellReportId}}">
              <option value="">Choose…</option>
              {{#each reports}}
                <option value="{{._id}}">{{.name}} — {{.track}}</option>
              {{/each}}
            </select>
          </label>
          <label class="field">
            <span class="field-name">Account / project name</span>
            <input type="text" value="{{shellSubject}}" placeholder="e.g. GCash Design Support" />
          </label>
          <label class="field">
            <span class="field-name">Close date</span>
            <input type="date" value="{{shellCloseDate}}" />
          </label>
        </div>
        <button class="btn btn-primary" on-click="@this.createShell()"
          disabled="{{!shellReportId || !shellSubject || !shellCloseDate}}">Open shell</button>
        <p class="boundary-note">
          A shell is the name and the close date — nothing else. The answers, the nominations, and the words are theirs.
        </p>
      </div>
    </section>

    <section>
      <div class="section-label">Confirmer approvals <span class="count">{{queue.length}}</span></div>
      {{#if queue.length}}
        {{#each queue: qi}}
          <article class="record">
            <div class="record-head">
              <span class="record-subject">{{.subject.name}}</span>
              <span class="meta">{{.talentName}}</span>
              {{#if .nomination.thinPool}}<span class="stamp stamp-adjust" style="position: static; transform: none;">THIN POOL</span>{{/if}}
            </div>
            <div class="record-meta">
              <span class="tag">{{.periodTag}}</span>
              <span>{{.claims.length}} claims, all approved by the talent</span>
            </div>
            {{#each .nomination.nominees}}
              <div style="border-top: 1px solid var(--rule); padding-top: 0.6rem; margin-top: 0.6rem;">
                <div class="record-meta">
                  <strong style="color: var(--ink); font-family: var(--sans);">{{.name}}</strong>
                  <span>{{.role}}</span>
                  {{#if ~/queue[qi].repeatStreaks[.name] >= 2}}
                    <span class="tag" style="color: var(--amber-ink);">
                      same reviewer {{~/queue[qi].repeatStreaks[.name] + 1}} cards in a row — consider rotating (your call)
                    </span>
                  {{/if}}
                </div>
                <p class="muted" style="font-size: var(--text-xs);">
                  exposure: {{~/queue[qi].nomination.systemChecks.exposure[.name] || 'fallback path'}}
                </p>
                <button class="btn btn-primary" on-click="@this.approveNominee(~/queue[qi], this)">Approve — route to {{.name}}</button>
              </div>
            {{/each}}
            <div class="sweep-actions" style="margin-top: 0.75rem;">
              <input type="text" value="{{.rejectReason}}" placeholder="Reason (required) — returns the pick to the talent" style="flex: 2;" />
              <button class="btn btn-danger" on-click="@this.rejectNominee(this)">Reject nominees</button>
            </div>
            <p class="boundary-note" style="margin-top: 0.5rem;">You approve or reject with a reason. You never pick a substitute — that's theirs.</p>
          </article>
        {{/each}}
      {{else}}
        <div class="empty-state">No cards waiting on your confirmer approval.</div>
      {{/if}}
    </section>

    <section>
      <div class="section-label">Reports <span class="count">{{reports.length}}</span></div>
      {{#if reports.length}}
        {{#each reports}}
          <article class="record">
            <div class="record-head"><span class="record-subject">{{.name}}</span></div>
            <div class="record-meta"><span class="tag">{{.track}}</span><span>{{.email}}</span></div>
          </article>
        {{/each}}
      {{else}}
        <div class="empty-state">No reports are assigned to you yet.</div>
      {{/if}}
    </section>

    <section>
      <div class="section-label">Confirmed records <span class="count">{{cards.length}}</span></div>
      {{#if cards.length}}
        {{#each cards}}
          <article class="record">
            <div class="record-head"><span class="record-subject">{{.subject.name}}</span></div>
            <div class="record-meta">
              <span class="tag">{{.periodTag}}</span>
              <span>{{.claims.length}} claims</span>
            </div>
            <span class="stamp stamp-confirmed">Confirmed</span>
          </article>
        {{/each}}
      {{else}}
        <div class="empty-state">
          Confirmed cards from your reports appear here — counts and statuses only, never a ranking.
        </div>
      {{/if}}
    </section>
  </main>
</script>
