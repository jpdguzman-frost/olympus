<script id="tpl-root" type="text/ractive">
  <header class="topbar">
    <div class="topbar-inner">
      <span class="wordmark">OLYMPUS <span class="sub">· EVIDENCE</span></span>
      <span class="topbar-spacer"></span>
      {{#if me}}
        <span class="whoami">
          {{me.name}}
          {{#each me.roles}}<span class="role-chip">{{this}}</span>{{/each}}
        </span>
        {{#if isLead}}<a href="/lead.html">Team</a>{{/if}}
        {{#if isAdmin}}<a href="/admin.html">Admin</a>{{/if}}
        <button class="linkish" on-click="@this.logout()">Sign out</button>
      {{/if}}
    </div>
  </header>
  <main class="wrap">
    {{#if error}}<div class="error-note">{{error}}</div>{{/if}}
    {{#if view === 'home'}}
      {{>home}}
    {{elseif view === 'capture'}}
      {{>capture}}
    {{elseif view === 'detail'}}
      {{>detail}}
    {{else}}
      <p class="loading">Opening the ledger…</p>
    {{/if}}
  </main>
</script>

<script id="tpl-home" type="text/ractive">
  <div class="capture-head">
    <h1>{{me.name.split(' ')[0]}}'s record</h1>
    <span class="topbar-spacer"></span>
    {{#if isTalent}}
      <button class="btn btn-primary" on-click="@this.startCard()">Start a card</button>
    {{/if}}
  </div>

  {{#if isTalent}}
    <section>
      <div class="section-label">Ladder</div>
      {{#if ladder && ladder.level}}
        <div class="record" style="border-left: 3px solid var(--carbon);">
          <div class="record-head">
            <span class="record-subject" style="font-size: var(--text-display);">{{ladder.level}}{{#if ladder.texture}} · {{ladder.texture}}{{/if}}</span>
          </div>
          <div class="record-meta">
            <span class="tag">floor: {{ladder.floor}}</span>
            <span>{{ladder.confirmedClaims}} confirmed claims on record</span>
          </div>
          {{#if ladder.basis}}
            <p class="muted" style="font-size: var(--text-sm); margin-top: 0.5rem;">
              Read from {{ladder.basis.competency}}{{#if ladder.basis.subject}} on {{ladder.basis.subject}}{{/if}}:
            </p>
            <p class="verbatim">“{{ladder.basis.quote}}”</p>
          {{/if}}
          {{#if ladder.honestGap}}
            <p class="muted" style="font-size: var(--text-sm); margin-top: 0.75rem;"><strong>Your honest gap, in your words:</strong> {{ladder.honestGap}}</p>
          {{/if}}
          {{#each ladder.notes}}
            <p class="muted" style="font-size: var(--text-xs); color: var(--amber-ink); margin-top: 0.3rem;">{{this}}</p>
          {{/each}}
        </div>
      {{else}}
        <div class="ladder-pending">
          <span class="meta">READ FROM YOUR CONFIRMED CARDS — NO ONE SETS THIS BY HAND</span>
          Nothing here yet. When your first card is confirmed, your level shows up here.
        </div>
      {{/if}}
    </section>
  {{/if}}

  {{#if signoffs.length}}
    <section>
      <div class="section-label">Picks to check <span class="count">{{signoffs.length}}</span></div>
      {{#each signoffs}}
        <article class="record">
          <div class="record-head">
            <span class="record-subject">{{.subject.name}}</span>
            <span class="meta">{{.talentName}}</span>
          </div>
          <div class="record-meta">
            {{#if .periodTag}}<span class="tag">{{.periodTag}}</span>{{/if}}
            <span>{{.talentName}} picked <strong style="color: var(--ink);">{{.nomineeName}}</strong> to confirm this card</span>
            {{#if .repeatStreak >= 2}}
              <span class="tag" style="color: var(--amber-ink);">same pair {{.repeatStreak}} cards in a row</span>
            {{/if}}
          </div>
          <p class="muted" style="font-size: var(--text-sm); margin: 0.5rem 0 0;">
            One question: did {{.nomineeName}} really see this work? Say how you know, or send the pick back.
          </p>
          <div class="sweep-actions" style="margin-top: 0.5rem; flex-wrap: wrap;">
            <input type="text" value="{{.confirmNote}}" placeholder="How do you know they saw it? (one line)" style="flex: 2;" />
            <button class="btn btn-primary" on-click="@this.confirmSignoff(this)">They saw it</button>
          </div>
          <div class="sweep-actions" style="margin-top: 0.4rem; flex-wrap: wrap;">
            <input type="text" value="{{.refuseReason}}" placeholder="Why not? (goes back to the talent)" style="flex: 2;" />
            <button class="btn btn-danger" on-click="@this.refuseSignoff(this)">Send the pick back</button>
          </div>
        </article>
      {{/each}}
    </section>
  {{/if}}

  {{#if queue.length}}
    <section>
      <div class="section-label">To review <span class="count">{{queue.length}}</span></div>
      {{#each queue}}
        <article class="record">
          <div class="record-head">
            <span class="record-subject">{{.subject.name}}</span>
          </div>
          <div class="record-meta">
            <span class="tag">{{.periodTag}}</span>
            <span>sent to you</span>
          </div>
          <div class="record-foot">
            <span class="muted" style="font-size: var(--text-sm);">Did you see this work? Say yes, or send it back with a note.</span>
            <span class="spacer"></span>
            <button class="btn btn-primary" on-click="@this.openCard(._id)">Review</button>
          </div>
          <span class="stamp stamp-inflight">Routed</span>
        </article>
      {{/each}}
    </section>
  {{/if}}

  {{#if isTalent}}
    <section>
      <div class="section-label">On record <span class="count">{{home.confirmed.length}}</span></div>
      {{#if home.confirmed.length}}
        {{#each home.confirmed}}
          <article class="record">
            <div class="record-head">
              <span class="record-subject">{{.subject.name}}</span>
            </div>
            <div class="record-meta">
              <span class="tag">{{.periodTag}}</span>
              <span>{{.subject.kind}}</span>
              <span>{{.claims.length}} claims</span>
            </div>
            <span class="stamp stamp-confirmed">Confirmed</span>
          </article>
        {{/each}}
      {{else}}
        <div class="empty-state">Nothing here yet. When a card is confirmed, it lands here.</div>
      {{/if}}
    </section>

    <section>
      <div class="section-label">Open drafts <span class="count">{{home.drafts.length}}</span></div>
      {{#if home.drafts.length}}
        {{#each home.drafts}}
          <article class="record">
            <div class="record-head">
              {{#if .subject.name}}
                <span class="record-subject">{{.subject.name}}</span>
              {{else}}
                <span class="record-subject unnamed">Unnamed {{.subject.kind}}</span>
              {{/if}}
            </div>
            <div class="record-meta">
              {{#if .periodTag}}<span class="tag">{{.periodTag}}</span>{{/if}}
              <span>{{answeredCount(this)}} of 4 answered</span>
              {{#if .submittedForStructuringAt}}<span>sent — being read</span>{{/if}}
            </div>
            <div class="record-foot">
              <span class="spacer"></span>
              <button class="btn btn-secondary" on-click="@this.openCard(._id)">Continue</button>
            </div>
            <span class="stamp stamp-draft">Draft</span>
          </article>
        {{/each}}
      {{else}}
        <div class="empty-state">
          No open drafts. Start a card. Four questions, a few minutes, any language.
        </div>
      {{/if}}
    </section>

    {{#if quarterTags.length}}
      <section>
        <div class="section-label">By quarter</div>
        {{#each quarterTags}}
          <article class="record">
            <div class="record-head"><span class="record-subject" style="font-family: var(--mono); font-size: var(--text-base);">{{this}}</span></div>
            <div class="record-meta"><span>{{~/quarters[this].length}} confirmed card(s)</span></div>
            {{#each ~/quarters[this]}}
              <div class="record-meta" style="margin-top: 0.3rem;">
                <span style="color: var(--ink); font-family: var(--sans);">{{.subject.name}}</span>
                <span>{{.claims}} claims</span>
              </div>
            {{/each}}
          </article>
        {{/each}}
      </section>
    {{/if}}

    {{#if home.inFlight.length}}
      <section>
        <div class="section-label">In flight <span class="count">{{home.inFlight.length}}</span></div>
        {{#each home.inFlight}}
          <article class="record">
            <div class="record-head">
              <span class="record-subject">{{.subject.name}}</span>
            </div>
            <div class="record-meta">
              <span class="tag">{{.periodTag}}</span>
              {{#if .inCalibration}}<span>with JP for a first check</span>{{else}}<span>{{.claims.length}} lines drafted</span>{{/if}}
            </div>
            <div class="record-foot">
              <span class="spacer"></span>
              <button class="btn btn-secondary" on-click="@this.openCard(._id)">View</button>
            </div>
            <span class="stamp {{stampClass(.status)}}">{{statusLabel(.status)}}</span>
          </article>
        {{/each}}
      </section>
    {{/if}}
  {{/if}}
</script>
