<script id="tpl-detail" type="text/ractive">
  <div class="capture-head">
    <button class="btn-quiet btn" on-click="@this.goHome()">← Back</button>
    <h1>{{card.subject.name}}</h1>
    <span class="topbar-spacer"></span>
    <span class="stamp {{stampClass(card.status)}}" style="position: static; transform: rotate(-3deg);">{{statusLabel(card.status)}}</span>
  </div>

  <div class="record-meta" style="margin-bottom: 1.5rem;">
    {{#if card.periodTag}}<span class="tag">{{card.periodTag}}</span>{{/if}}
    <span>{{card.subject.kind}}</span>
    {{#if card.packVersion}}<span>pack {{card.packVersion}}</span>{{/if}}
    {{#if card.stale}}<span class="tag" style="color: var(--amber-ink);">STALE — filed late, long after the work ended. Context only, never a block</span>{{/if}}
  </div>

  {{#if notice}}<div class="banner banner-safe">{{notice}}</div>{{/if}}
  {{#if actionError}}<div class="banner banner-warn">{{actionError}}</div>{{/if}}

  {{#if isDocScreen && card.status === 'structured'}}
    <div class="banner banner-info">
      {{card.claims.length}} line{{card.claims.length === 1 ? '' : 's'}} from your words.
      {{docReady}} ready{{#if docAside}} · {{docAside}} need{{docAside === 1 ? 's' : ''}} one thing{{/if}}{{#if docLeftOut}} · {{docLeftOut}} left out{{/if}}.
      Start at the top. One button sends the ready ones.
    </div>
  {{/if}}
  {{#if isDocScreen && (card.status === 'structured' || needsResend)}}
    <div class="shell-form" style="margin-bottom: 1.25rem;">
      <div class="sweep-actions" style="flex-wrap: wrap; align-items: center;">
        <strong style="font-size: var(--text-sm);">Goes to:</strong>
        <select value="{{checkerPick}}" style="flex: 1; min-width: 12rem;">
          <option value="">— pick who checks this —</option>
          {{#each candidates}}
            <option value="{{._id}}">{{.name}}{{#if .repeatStreak >= 2}} (used {{.repeatStreak}} cards in a row){{/if}}</option>
          {{/each}}
        </select>
        <span class="muted" style="font-size: var(--text-xs);">One person who saw this work covers every line. You can switch a single line below.</span>
      </div>
      <div class="sweep-actions" style="margin-top: 0.4rem;">
        <button class="btn btn-quiet" on-click="@this.submitThinPool()">No one fits — use the backup path</button>
      </div>
    </div>
  {{/if}}

  {{#if isDocScreen && card.status !== 'structured' && !needsResend}}
    <div class="banner banner-info">
      Sent. The lines below are locked while it moves — you'll hear when something needs you.
    </div>
  {{/if}}

  {{#if isAdjustScreen}}
    <div class="banner banner-info">
      Your checker sent something back. Read their notes. Fix each returned line, or stand by it. Then send it back.
    </div>
  {{/if}}

  {{#if isReviewScreen}}
    <div class="banner banner-info">
      {{card.talentName || 'The talent'}} picked you because you saw this work. These are the lines sent to YOU — check each against their words.
      True? Confirm it. Not true? Send it back with a note.
      And when their area needed a decision — who really made the call? Don't round up.
    </div>
  {{/if}}

  {{#if card.status === 'deadlocked'}}
    <div class="banner banner-warn">
      You and your checker see this differently. Both sides are saved. JP will read both and give guidance.
      The final call still belongs to the checker.
    </div>
  {{/if}}

  {{#if card.ruling}}
    <div class="banner banner-info">
      <strong>JP's take, on the record:</strong> “{{card.ruling.text}}”
      <span class="meta"> — this is guidance. The checker still makes the call.</span>
    </div>
  {{/if}}

  {{#if card.nomination && card.nomination.exposureSignoff && card.nomination.exposureSignoff.decision === 'refuse' && card.status === 'talent-approved'}}
    <div class="banner banner-warn">
      Your pick came back: “{{card.nomination.exposureSignoff.reason}}” Pick someone else above the lines it covered, then send again.
    </div>
  {{/if}}

  {{#if card.status === 'exposure-signoff' && isDocScreen}}
    <div class="banner banner-info">
      Your pick is being checked — one quick question to someone who'd know: did they really see this work?
    </div>
  {{/if}}

  {{#if card.claims.length}}
    <section>
      <div class="section-label">Your lines <span class="count">{{card.claims.length}}</span></div>
      {{#each card.claims: ci}}
        <article class="record">
          <div class="record-head" {{#if collapsible(this)}}on-click="@this.toggleExpand(ci)" style="cursor: pointer;"{{/if}}>
            {{#if collapsible(this)}}<span class="meta">{{.expanded ? '▾' : '▸'}}</span>{{/if}}
            <span class="record-subject">{{.competencyOrDomain}}</span>
            {{#if isDocScreen && !.verdict}}
              <span class="tag" style="color: {{lineState(this) === 'Ready' ? 'var(--stamp-green)' : 'var(--amber-ink)'}};">{{lineState(this)}}</span>
            {{/if}}
            {{#if .verdict}}<span class="stamp {{.verdict === 'Confirmed' ? 'stamp-confirmed' : 'stamp-adjust'}}" style="position: static; transform: none;">{{.verdict}}</span>{{/if}}
          </div>

          {{#if collapsible(this) && !.expanded}}
            <p class="verbatim" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 0.3rem 0 0;">“{{.sourceQuote}}”</p>
          {{else}}

          <p class="muted" style="font-size: var(--text-xs); margin: 0.3rem 0 0.1rem;">{{#if isReviewScreen}}Because they said:{{else}}Because you said:{{/if}}</p>
          <p class="verbatim">“{{.sourceQuote}}”</p>

          {{#if isDocScreen && card.status === 'structured' && .aside && !openContention(this)}}
            <p style="font-size: var(--text-sm); color: var(--amber-ink); margin: 0.4rem 0 0.2rem;">{{askFor(this)}}</p>
            {{#if !.threadOpen}}
              <div class="sweep-actions">
                <button class="btn btn-primary" on-click="@this.toggleThread(ci)">Add what's missing</button>
              </div>
            {{/if}}
          {{/if}}

          {{#if isDocScreen && card.status === 'structured'}}
            {{#each .lineSignals}}
              <div class="context-strip" style="margin-top: 0.5rem;">
                <p style="font-size: var(--text-sm); margin: 0 0 0.2rem;"><strong>Also yours?</strong> {{.signal}}</p>
                <p class="verbatim" style="margin: 0.2rem 0; font-size: var(--text-sm);">“{{.sourceQuote}}”</p>
                <div class="sweep-actions" style="margin-top: 0.3rem;">
                  <button class="btn btn-secondary" on-click="@this.claimSignalOnLine(ci, this)">Yes — add it to this line</button>
                  <button class="btn btn-quiet" on-click="@this.skipSignal(this)">No</button>
                </div>
              </div>
            {{/each}}
          {{/if}}

          <div class="record-meta" style="margin-top: 0.5rem;">
            {{#each .labels:field}}<span class="tag">{{field}}: {{this}}</span>{{/each}}
            {{#if .countAfterMe !== null}}<span>{{.countAfterMe}} after me</span>{{/if}}
            {{#if isDocScreen && card.nomination.routes && card.nomination.routes.length > 1 && .checkerId}}
              <span class="tag">goes to {{checkerName(.checkerId)}}</span>
            {{/if}}
          </div>
          {{#if .rationale}}
            <p class="muted" style="font-size: var(--text-sm); margin-top: 0.3rem;">
              <span class="tag">why it reads this way</span> {{.rationale}}
              {{#if !isReviewScreen}}
                <button class="linkish" on-click="@this.toggleContext(ci)" style="font-size: var(--text-xs);">{{.showContext ? 'hide the conversation' : 'see it in the conversation'}}</button>
              {{/if}}
            </p>
          {{/if}}
          {{#if .showContext && .contextTurns}}
            <div class="context-strip" style="margin-top: 0.4rem;">
              {{#each .contextTurns}}
                <p style="font-size: var(--text-sm); margin: 0.2rem 0; {{#if .hit}}border-left: 3px solid var(--carbon); padding-left: 0.5rem;{{/if}}">
                  <span class="meta">{{.role === 'ai' ? 'OLYMPUS' : 'YOU'}}:</span> {{.text}}
                </p>
              {{/each}}
            </div>
          {{/if}}
          {{#if .anchorText}}
            <p class="muted" style="font-size: var(--text-sm);"><span class="tag">when &amp; where</span> {{.anchorText}}</p>
          {{/if}}
          {{#if .involvement}}<p class="muted" style="font-size: var(--text-sm);">{{.involvement}}</p>{{/if}}
          {{#if visibleFlags(this).length}}
            <div style="margin-top: 0.4rem;">
              {{#each visibleFlags(this)}}
                <p class="muted" style="font-size: var(--text-sm); color: var(--amber-ink);">{{flagNudge(this)}}</p>
              {{/each}}
            </div>
          {{/if}}
          {{#each .contentions}}
            {{#if .outcome === null}}
              <div class="banner banner-info" style="margin: 0.6rem 0 0;">Being re-checked against your words — the answer lands here in about a minute.</div>
            {{elseif .response}}
              <div class="banner banner-info" style="margin: 0.6rem 0 0;">
                {{#if .outcome === 'remapped'}}Re-mapped from your words.{{/if}} {{.response}}
              </div>
            {{/if}}
          {{/each}}
          {{#if .needsRelook && isDocScreen}}
            <div class="banner banner-warn" style="margin: 0.6rem 0 0;">
              JP changed this line. Read it again — if it's right, send the card again and it rides along. If not, talk it out.
            </div>
          {{/if}}
          {{#if .verdictNote}}
            <div class="banner {{.verdict === 'Confirmed' ? 'banner-safe' : 'banner-warn'}}" style="margin: 0.6rem 0 0;">
              {{#if .verdict === 'Confirmed'}}Checked by your reviewer: {{else}}Reviewer's note: {{/if}}{{.verdictNote}}
            </div>
          {{/if}}
          {{#if .defenseStatement}}
            <div class="banner banner-info" style="margin: 0.6rem 0 0;">
              The talent stands by this line: “{{.defenseStatement}}”
            </div>
          {{/if}}
          {{#if .concessionReason}}
            <p class="muted" style="font-size: var(--text-sm); margin-top: 0.4rem;">
              Changed after standing by it. Why: {{.concessionReason}}
            </p>
          {{/if}}

          {{#if isDocScreen && card.status === 'structured' && !openContention(this)}}
            <div class="sweep-actions" style="margin-top: 0.5rem; flex-wrap: wrap;">
              {{#if !.aside}}
                <button class="btn btn-quiet" on-click="@this.toggleThread(ci)">{{.threadOpen ? 'Close the thread' : "Something's off — talk it out"}}</button>
                <button class="btn btn-quiet" on-click="@this.toggleLeftOut(ci)">{{.leftOut ? 'Put it back in' : 'Leave this one out'}}</button>
                <select value="{{.overridePick}}" style="max-width: 16rem;">
                  <option value="">same person as the card</option>
                  {{#each ~/candidates}}
                    <option value="{{._id}}">a different person saw this: {{.name}}</option>
                  {{/each}}
                </select>
              {{elseif .threadOpen}}
                <button class="btn btn-quiet" on-click="@this.toggleThread(ci)">Close the thread</button>
              {{/if}}
              <button class="btn btn-danger" on-click="@this.removeClaim(this)">Not mine — remove</button>
            </div>
            {{#if .threadOpen}}
              <div class="sweep-panel" style="margin-top: 0.5rem;">
                {{#each .thread}}
                  <p style="font-size: var(--text-sm); margin: 0.25rem 0; {{#if .role === 'talent'}}border-left: 3px solid var(--carbon); padding-left: 0.5rem;{{/if}}">
                    <span class="meta">{{.role === 'ai' ? 'OLYMPUS' : 'YOU'}}:</span> {{.text}}
                  </p>
                {{/each}}
                <textarea value="{{.threadInput}}" placeholder="{{.aside ? 'The missing piece, or anything to fix — in your own words' : 'What looks wrong about this line — in your own words'}}" style="min-height: 4rem;"></textarea>
                <div class="sweep-actions">
                  <button class="btn btn-primary" on-click="@this.threadSend(this, ci)" disabled="{{!(.threadInput || '').trim()}}">Send</button>
                  {{#if hasThreadWords(this)}}
                    <button class="btn btn-secondary" on-click="@this.threadClose(this, ci)">That's it — re-check the line now</button>
                  {{/if}}
                  {{#if .seedSignal}}
                    <span class="spacer"></span>
                    <button class="btn btn-quiet" on-click="@this.putBackSignal(this)">Never mind — put it back</button>
                  {{/if}}
                </div>
              </div>
            {{/if}}
          {{/if}}

          {{#if isAdjustScreen && (!.talentApproved || card.status === 'adjust')}}
            {{#if .editing}}
              <div class="sweep-actions" style="flex-wrap: wrap;">
                {{#each vocabFields: vi}}
                  <label class="field" style="flex: 1; min-width: 14rem; margin: 0;">
                    <span class="field-name" style="font-family: var(--mono); font-size: var(--text-xs);">{{this}}</span>
                    <select value="{{~/card.claims[ci].editLabels[this]}}">
                      <option value="">— leave out —</option>
                      {{#each ~/track.controlledVocabulary[this]}}
                        <option value="{{this}}">{{this}}</option>
                      {{/each}}
                    </select>
                  </label>
                {{/each}}
                {{#if .defenseStatement}}
                  <input type="text" value="{{.concessionText}}" placeholder="You stood by this line before. Why change it now? (required)" style="flex: 2; min-width: 100%;" />
                {{/if}}
                <button class="btn btn-primary" on-click="@this.saveFix(this, ci)">Save fix</button>
                <button class="btn btn-quiet" on-click="@this.set('card.claims.' + ci + '.editing', false)">Cancel</button>
              </div>
            {{else}}
              {{#if .verdict === 'Adjust'}}
                <div class="sweep-actions" style="flex-wrap: wrap; margin-top: 0.5rem;">
                  <button class="btn btn-primary" on-click="@this.approveClaim(this)" disabled="{{!.anchorText}}">Send it back as it is</button>
                  <button class="btn btn-secondary" on-click="@this.startFix(this, ci)">Fix it</button>
                  <button class="btn btn-danger" on-click="@this.removeClaim(this)">Not mine — remove</button>
                </div>
                {{#if !.defenseStatement}}
                  <div class="sweep-actions" style="margin-top: 0.4rem;">
                    <input type="text" value="{{.defenseText}}" placeholder="Or keep it as is — say why" style="flex: 2;" />
                    <button class="btn btn-secondary" on-click="@this.defendClaim(this)">It stands — keep it</button>
                  </div>
                {{/if}}
              {{/if}}
            {{/if}}
          {{/if}}

          {{#if isReviewScreen && !.verdict}}
            <div class="sweep-actions" style="flex-wrap: wrap;">
              <input type="text" value="{{.attestation}}" placeholder="What did you check? (one line, needed to confirm)" style="flex: 2;" />
              <button class="btn btn-primary" on-click="@this.sendVerdict(this, 'Confirmed')">Confirmed — I checked this</button>
            </div>
            <div class="sweep-actions" style="margin-top: 0.4rem;">
              <input type="text" value="{{.adjustNote}}" placeholder="What doesn't match what you saw? (needed to send back)" style="flex: 2;" />
              <button class="btn btn-danger" on-click="@this.sendVerdict(this, 'Adjust')">Send back (Adjust)</button>
            </div>
          {{/if}}

          {{/if}}
        </article>
      {{/each}}
    </section>
  {{/if}}

  {{#if isDocScreen && card.status === 'structured' && (boltInsView.length || signalsElsewhere.length)}}
    <section>
      <div class="section-label">More you can claim</div>
      {{#if signalsElsewhere.length}}
        <p class="muted" style="font-size: var(--text-sm); margin-bottom: 0.5rem;">
          From your own words — no line for these yet. Yours to claim, or skip.
        </p>
        {{#each signalsElsewhere}}
          <div class="question-block">
            <div class="question-text">{{#if .competencyOrDomain}}<span class="tag">{{.competencyOrDomain}}</span> {{/if}}{{.signal}}</div>
            <p class="verbatim">“{{.sourceQuote}}”</p>
            <div class="sweep-actions" style="margin-top: 0.3rem;">
              <button class="btn btn-secondary" on-click="@this.startSignalClaim(this)">Yes, that's mine — tell it</button>
              <button class="btn btn-quiet" on-click="@this.skipSignal(this)">Not mine — skip</button>
            </div>
          </div>
        {{/each}}
      {{/if}}
      {{#if boltInsView.length}}
        <button class="linkish" on-click="@this.toggle('moreOpen')" style="margin-top: 0.5rem;">
          {{moreOpen ? '▾' : '▸'}} The full add-on list ({{boltInsView.length}}) — claim only what is truly yours
        </button>
        {{#if moreOpen}}
          <div class="sweep-actions" style="flex-wrap: wrap; margin-top: 0.5rem;">
            {{#each boltInsView}}
              <button class="btn {{.claimed || .open ? 'btn-quiet' : 'btn-secondary'}}" on-click="@this.startBoltIn(this)" disabled="{{.claimed || .open}}">
                {{.name}}{{#if .claimed}} ✓ claimed{{elseif .open}} · open below{{/if}}
              </button>
            {{/each}}
          </div>
        {{/if}}
      {{/if}}
    </section>
  {{/if}}

  {{#if card.boltInThreads && card.boltInThreads.length && isDocScreen}}
    <section>
      <div class="section-label">Add-on threads</div>
      {{#each card.boltInThreads: ti}}
        <div class="sweep-panel" style="margin-bottom: 0.6rem;">
          <p style="margin-bottom: 0.4rem;"><strong>{{.competency || .fromSignal}}</strong></p>
          {{#each .thread}}
            <p style="font-size: var(--text-sm); margin: 0.25rem 0; {{#if .role === 'talent'}}border-left: 3px solid var(--carbon); padding-left: 0.5rem;{{/if}}">
              <span class="meta">{{.role === 'ai' ? 'OLYMPUS' : 'YOU'}}:</span> {{.text}}
            </p>
          {{/each}}
          {{#if .status === 'structuring'}}
            <div class="banner banner-info" style="margin-top: 0.4rem;">Being written into a line — it lands on your card in about a minute.</div>
          {{elseif .status === 'done'}}
            <div class="banner banner-safe" style="margin-top: 0.4rem;">{{.response}}</div>
          {{elseif .status === 'nothing'}}
            <div class="banner banner-warn" style="margin-top: 0.4rem;">{{.response}}
              <button class="linkish" on-click="@this.boltInReopen(this)">Add more</button>
              <button class="linkish" on-click="@this.boltInDismiss(this)">Never mind — close this</button>
            </div>
          {{else}}
            <textarea value="{{.input}}" placeholder="In your own words — what, where, since when" style="min-height: 4rem;"></textarea>
            <div class="sweep-actions">
              <button class="btn btn-primary" on-click="@this.boltInSend(this)" disabled="{{!(.input || '').trim()}}">Send</button>
              {{#if hasThreadWords(this)}}
                <button class="btn btn-secondary" on-click="@this.boltInClose(this)">That's it — write it up</button>
              {{/if}}
              <span class="spacer"></span>
              <button class="btn btn-quiet" on-click="@this.boltInDismiss(this)">Never mind — close this</button>
            </div>
          {{/if}}
        </div>
      {{/each}}
    </section>
  {{/if}}

  {{#if isReviewScreen && card.signalsNoted && card.signalsNoted.length}}
    <section>
      <div class="section-label">Also in their words, not claimed</div>
      {{#each card.signalsNoted}}
        <div class="question-block">
          <div class="question-text">{{#if .competencyOrDomain}}<span class="tag">{{.competencyOrDomain}}</span> {{/if}}{{.signal}}</div>
          <p class="verbatim">“{{.sourceQuote}}”</p>
          <p class="muted" style="font-size: var(--text-xs);">
            {{#if .talentSaid === 'not-mine'}}They said this is not theirs — that answer is on record.{{else}}They chose not to claim this — you can still ask about it.{{/if}}
          </p>
        </div>
      {{/each}}
    </section>
  {{/if}}

  {{#if isDocScreen && card.status === 'structured'}}
    <div class="submit-bar" style="flex-wrap: wrap;">
      <span class="muted" style="font-size: var(--text-sm);">
        {{sendSummary}} You can change any line until you send. Set-aside lines stay behind as drafts — no penalty.
      </span>
      <span class="spacer"></span>
      <button class="btn btn-primary" on-click="@this.sendCard()" disabled="{{!checkerPick || !docReady}}">
        This is right — send it{{#if checkerPickName}} to {{checkerPickName}}{{/if}}
      </button>
    </div>
  {{/if}}

  {{#if isDocScreen && card.status !== 'structured' && needsResend}}
    <div class="submit-bar" style="flex-wrap: wrap;">
      <span class="muted" style="font-size: var(--text-sm);">Something came back to you. Fix the pick or re-look the line, then send again.</span>
      <span class="spacer"></span>
      <button class="btn btn-primary" on-click="@this.sendCard()" disabled="{{!checkerPick}}">Send it again{{#if checkerPickName}} — to {{checkerPickName}}{{/if}}</button>
    </div>
  {{/if}}

  {{#if isAdjustScreen}}
    <div class="submit-bar">
      <span class="muted" style="font-size: var(--text-sm);">Fix the returned lines, or stand by them. Then send it back.</span>
      <span class="spacer"></span>
      <button class="btn btn-primary" on-click="@this.rerouteCard()">Send back for review</button>
    </div>
  {{/if}}

  {{#if isReviewScreen && card.status === 'ruled'}}
    <div class="submit-bar" style="flex-wrap: wrap;">
      <span class="muted" style="font-size: var(--text-sm);">
        Read JP's take above, then check the lines again. If you agree now, write your call above — it is still yours alone.
        If you still can't, say your final word here. The card then goes to a backup reviewer.
      </span>
      <input type="text" value="{{refuseText}}" placeholder="Your final word (required — saved for good)" style="flex: 2;" />
      <button class="btn btn-danger" on-click="@this.refuseRuling()">I still can't confirm this</button>
    </div>
  {{/if}}

  <section>
    <div class="section-label">Your words, on record</div>
    {{#each card.rawAnswers}}
      <div class="question-block">
        {{#if .questionIndex !== null}}<span class="question-number">{{.questionIndex + 1}} / 4</span>{{/if}}
        <div class="question-text">{{.question}}</div>
        <p class="verbatim">{{.answer}}</p>
      </div>
    {{/each}}
    {{#each card.sweepAnswers}}
      <div class="question-block">
        <span class="question-number">SWEEP</span>
        <p class="verbatim">{{.answer}}</p>
      </div>
    {{/each}}
  </section>
</script>
