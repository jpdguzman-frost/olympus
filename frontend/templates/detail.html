<script id="tpl-detail" type="text/ractive">
  <div class="capture-head">
    <button class="btn-quiet btn" on-click="@this.goHome()">← Back</button>
    <h1>{{card.subject.name}}</h1>
    <span class="topbar-spacer"></span>
    <span class="stamp {{stampClass(card.status)}}" style="position: static; transform: rotate(-3deg);">{{statusLabel(card.status)}}</span>
  </div>

  <div class="record-meta" style="margin-bottom: 1.5rem;">
    {{#if card.periodTag}}<span class="tag">{{card.periodTag}}</span>{{/if}}
    <span>{{card.subject.kind}}</span>
    {{#if card.packVersion}}<span>pack {{card.packVersion}}</span>{{/if}}
    {{#if card.stale}}<span class="tag" style="color: var(--amber-ink);">STALE — filed late, long after the work ended. Context only, never a block</span>{{/if}}
  </div>

  {{#if card.inCalibration}}
    <div class="banner banner-info">
      JP is giving this card a first check. Your lines show up here after that. Your words below are already saved.
    </div>
  {{/if}}

  {{#if notice}}<div class="banner banner-safe">{{notice}}</div>{{/if}}
  {{#if actionError}}<div class="banner banner-warn">{{actionError}}</div>{{/if}}

  {{#if isConfirmScreen}}
    <div class="banner banner-info">
      {{#if card.status === 'adjust'}}
        Your reviewer sent this back. Read their notes. Fix each line, or stand by it. Then send it back.
      {{else}}
        We turned your words into these lines. Check each one. Say yes if it's right, fix it if it's not. Nothing moves until every line is yours.
      {{/if}}
    </div>
  {{/if}}

  {{#if isReviewScreen}}
    <div class="banner banner-info">
      {{card.talentName || 'The talent'}} picked you because you saw this work. Check each line against their words.
      True? Confirm it. Not true? Send it back with a note.
      And when their area needed a decision — who really made the call? Don't round up.
    </div>
  {{/if}}

  {{#if card.status === 'deadlocked'}}
    <div class="banner banner-warn">
      You and your reviewer see this differently. Both sides are saved. JP will read both and give guidance.
      The final call still belongs to the reviewer.
    </div>
  {{/if}}

  {{#if card.ruling}}
    <div class="banner banner-info">
      <strong>JP's take, on the record:</strong> “{{card.ruling.text}}”
      <span class="meta"> — this is guidance. The reviewer still makes the call.</span>
    </div>
  {{/if}}

  {{#if card.claims.length}}
    <section>
      <div class="section-label">Claims <span class="count">{{card.claims.length}}</span></div>
      {{#each card.claims: ci}}
        <article class="record">
          <div class="record-head">
            <span class="record-subject">{{.competencyOrDomain}}</span>
            {{#if .talentApproved && isConfirmScreen}}<span class="meta" style="color: var(--stamp-green);">approved by you</span>{{/if}}
            {{#if .verdict}}<span class="stamp {{.verdict === 'Confirmed' ? 'stamp-confirmed' : 'stamp-adjust'}}" style="position: static; transform: none;">{{.verdict}}</span>{{/if}}
          </div>
          <div class="record-meta">
            {{#each .labels:field}}<span class="tag">{{field}}: {{this}}</span>{{/each}}
            {{#if .countAfterMe !== null}}<span>{{.countAfterMe}} after me</span>{{/if}}
          </div>
          {{#if .flags.length}}
            <div style="margin-top: 0.4rem;">
              {{#each .flags}}
                <p class="muted" style="font-size: var(--text-sm); color: var(--amber-ink);">{{flagNudge(this)}}</p>
              {{/each}}
            </div>
          {{/if}}
          <p class="verbatim">“{{.sourceQuote}}”</p>
          {{#if .involvement}}<p class="muted" style="font-size: var(--text-sm);">{{.involvement}}</p>{{/if}}
          {{#if .verdictNote}}
            <div class="banner {{.verdict === 'Confirmed' ? 'banner-safe' : 'banner-warn'}}" style="margin: 0.6rem 0 0;">
              {{#if .verdict === 'Confirmed'}}Checked by your reviewer: {{else}}Reviewer's note: {{/if}}{{.verdictNote}}
            </div>
          {{/if}}
          {{#if .defenseStatement}}
            <div class="banner banner-info" style="margin: 0.6rem 0 0;">
              The talent stands by this line: “{{.defenseStatement}}”
            </div>
          {{/if}}
          {{#if .concessionReason}}
            <p class="muted" style="font-size: var(--text-sm); margin-top: 0.4rem;">
              Changed after standing by it. Why: {{.concessionReason}}
            </p>
          {{/if}}

          {{#if isConfirmScreen && (!.talentApproved || card.status === 'adjust')}}
            {{#if .editing}}
              <div class="sweep-actions" style="flex-wrap: wrap;">
                {{#each vocabFields: vi}}
                  <label class="field" style="flex: 1; min-width: 14rem; margin: 0;">
                    <span class="field-name" style="font-family: var(--mono); font-size: var(--text-xs);">{{this}}</span>
                    <select value="{{~/card.claims[ci].editLabels[this]}}">
                      <option value="">— leave out —</option>
                      {{#each ~/track.controlledVocabulary[this]}}
                        <option value="{{this}}">{{this}}</option>
                      {{/each}}
                    </select>
                  </label>
                {{/each}}
                {{#if .defenseStatement}}
                  <input type="text" value="{{.concessionText}}" placeholder="You stood by this line before. Why change it now? (required)" style="flex: 2; min-width: 100%;" />
                {{/if}}
                <button class="btn btn-primary" on-click="@this.saveFix(this, ci)">Save fix</button>
                <button class="btn btn-quiet" on-click="@this.set('card.claims.' + ci + '.editing', false)">Cancel</button>
              </div>
            {{else}}
              <div class="sweep-actions" style="flex-wrap: wrap;">
                <button class="btn btn-primary" on-click="@this.approveClaim(this)">Yes — this is mine</button>
                <button class="btn btn-secondary" on-click="@this.startFix(this, ci)">Fix it</button>
                <button class="btn btn-danger" on-click="@this.removeClaim(this)">Not mine — remove</button>
              </div>
              {{#if card.status === 'adjust' && .verdict === 'Adjust' && !.defenseStatement}}
                <div class="sweep-actions" style="margin-top: 0.4rem;">
                  <input type="text" value="{{.defenseText}}" placeholder="Or keep it as is — say why" style="flex: 2;" />
                  <button class="btn btn-secondary" on-click="@this.defendClaim(this)">It stands — keep it</button>
                </div>
              {{/if}}
            {{/if}}
          {{/if}}

          {{#if isReviewScreen && !.verdict}}
            <div class="sweep-actions" style="flex-wrap: wrap;">
              <input type="text" value="{{.attestation}}" placeholder="What did you check? (one line, needed to confirm)" style="flex: 2;" />
              <button class="btn btn-primary" on-click="@this.sendVerdict(this, 'Confirmed')">Confirmed — I checked this</button>
            </div>
            <div class="sweep-actions" style="margin-top: 0.4rem;">
              <input type="text" value="{{.adjustNote}}" placeholder="What doesn't match what you saw? (needed to send back)" style="flex: 2;" />
              <button class="btn btn-danger" on-click="@this.sendVerdict(this, 'Adjust')">Send back (Adjust)</button>
            </div>
          {{/if}}
        </article>
      {{/each}}
    </section>
  {{/if}}

  {{#if card.followUps.length && isConfirmScreen}}
    <section>
      <div class="section-label">Follow-ups</div>
      {{#each card.followUps}}
        <div class="sweep-panel">
          <p style="margin-bottom: 0.5rem;">{{.question}}</p>
          <textarea value="{{.answer}}" placeholder="In your own words — “not me” is fine"></textarea>
          <div class="sweep-actions">
            <button class="btn btn-secondary" on-click="@this.answerFollowUp(this)">Save answer</button>
          </div>
        </div>
      {{/each}}
    </section>
  {{/if}}

  {{#if isConfirmScreen && card.status === 'structured'}}
    <div class="submit-bar">
      <span class="muted" style="font-size: var(--text-sm);">
        {{approvedCount}} of {{card.claims.length}} lines are yours.
      </span>
      <span class="spacer"></span>
      <button class="btn btn-primary" on-click="@this.openNomination()" disabled="{{approvedCount < card.claims.length || !card.claims.length}}">
        All good — pick who confirms
      </button>
    </div>

    {{#if nominating}}
      <section>
        <div class="section-label">Pick who confirms this</div>
        <div class="shell-form">
          <p class="muted" style="font-size: var(--text-sm); margin-bottom: 0.75rem;">
            Pick ONE person who saw this work. Not your lead. No one can swap in a different pick — only you choose.
          </p>
          {{#each candidates}}
            <label style="display: flex; gap: 0.5rem; align-items: center; padding: 0.25rem 0; font-size: var(--text-sm);">
              <input type="radio" name="nominee" checked="{{nomineePick === ._id}}" on-click="@this.set('nomineePick', ._id)" />
              {{.name}} <span class="meta">{{#if .track}}{{.track}}{{/if}}</span>
              {{#if .repeatStreak >= 2}}
                <span class="tag" style="color: var(--amber-ink);">you've used them {{.repeatStreak}} cards in a row — maybe pick someone new (your call)</span>
              {{/if}}
            </label>
          {{/each}}
          <div class="sweep-actions" style="margin-top: 0.75rem;">
            <button class="btn btn-primary" on-click="@this.submitNomination()" disabled="{{!nomineePick}}">Send my pick</button>
            <button class="btn btn-secondary" on-click="@this.submitThinPool()">No one fits — use the backup path</button>
          </div>
        </div>
      </section>
    {{/if}}
  {{/if}}

  {{#if isConfirmScreen && card.status === 'adjust'}}
    <div class="submit-bar">
      <span class="muted" style="font-size: var(--text-sm);">Fix the lines, or stand by them. Then send it back.</span>
      <span class="spacer"></span>
      <button class="btn btn-primary" on-click="@this.rerouteCard()">Send back for review</button>
    </div>
  {{/if}}

  {{#if isReviewScreen && card.status === 'ruled'}}
    <div class="submit-bar" style="flex-wrap: wrap;">
      <span class="muted" style="font-size: var(--text-sm);">
        Read JP's take above, then check the lines again. If you agree now, write your call above — it is still yours alone.
        If you still can't, say your final word here. The card then goes to a backup reviewer.
      </span>
      <input type="text" value="{{refuseText}}" placeholder="Your final word (required — saved for good)" style="flex: 2;" />
      <button class="btn btn-danger" on-click="@this.refuseRuling()">I still can't confirm this</button>
    </div>
  {{/if}}

  {{#if card.nomination && card.nomination.exposureSignoff && card.nomination.exposureSignoff.decision === 'refuse' && card.status === 'talent-approved'}}
    <div class="banner banner-warn">
      Your pick came back: “{{card.nomination.exposureSignoff.reason}}” Pick someone else.
    </div>
    <button class="btn btn-primary" on-click="@this.openNomination()">Pick someone</button>
    {{#if nominating}}
      <section>
        <div class="section-label">Pick who confirms this</div>
        <div class="shell-form">
          {{#each candidates}}
            <label style="display: flex; gap: 0.5rem; align-items: center; padding: 0.25rem 0; font-size: var(--text-sm);">
              <input type="radio" name="nominee2" checked="{{nomineePick === ._id}}" on-click="@this.set('nomineePick', ._id)" />
              {{.name}} <span class="meta">{{#if .track}}{{.track}}{{/if}}</span>
              {{#if .repeatStreak >= 2}}
                <span class="tag" style="color: var(--amber-ink);">you've used them {{.repeatStreak}} cards in a row — maybe pick someone new (your call)</span>
              {{/if}}
            </label>
          {{/each}}
          <div class="sweep-actions" style="margin-top: 0.75rem;">
            <button class="btn btn-primary" on-click="@this.submitNomination()" disabled="{{!nomineePick}}">Send my pick</button>
          </div>
        </div>
      </section>
    {{/if}}
  {{/if}}

  {{#if card.status === 'exposure-signoff'}}
    <div class="banner banner-info">
      Your pick is being checked — one quick question to someone who'd know: did they really see this work?
    </div>
  {{/if}}

  <section>
    <div class="section-label">Your words, on record</div>
    {{#each card.rawAnswers}}
      <div class="question-block">
        {{#if .questionIndex !== null}}<span class="question-number">{{.questionIndex + 1}} / 4</span>{{/if}}
        <div class="question-text">{{.question}}</div>
        <p class="verbatim">{{.answer}}</p>
      </div>
    {{/each}}
    {{#each card.sweepAnswers}}
      <div class="question-block">
        <span class="question-number">SWEEP</span>
        <p class="verbatim">{{.answer}}</p>
      </div>
    {{/each}}
  </section>
</script>
