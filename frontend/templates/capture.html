<script id="tpl-capture" type="text/ractive">
  <div class="capture-head">
    <button class="btn-quiet btn" on-click="@this.goHome()">← Back</button>
    <h1>{{#if subjectName}}{{subjectName}}{{else}}New {{card.subject.kind}} card{{/if}}</h1>
    <span class="topbar-spacer"></span>
    <span class="savestate {{#if saveState === 'saved'}}saved{{/if}}">
      {{#if saveState === 'saving'}}saving…{{elseif saveState === 'saved'}}saved{{else}}&nbsp;{{/if}}
    </span>
  </div>

  {{#if card.captureMode === 'conversation'}}
    {{#if summaryText}}
      <div class="context-strip">
        <div class="context-title">What you did here, from CAPS — memory only, never evidence</div>
        <p style="white-space: pre-line; font-size: var(--text-sm); margin: 0.25rem 0;">{{summaryText}}</p>
        <div class="note">Only what you say below counts.</div>
      </div>
    {{/if}}

    <section>
      <div class="section-label">The conversation</div>
      {{#each card.conversation}}
        <div class="question-block" style="{{#if .role === 'talent'}}border-left: 3px solid var(--carbon); margin-left: 2rem;{{/if}}">
          <span class="question-number">{{#if .role === 'ai'}}OLYMPUS{{else}}YOU{{/if}}</span>
          <p class="{{#if .role === 'talent'}}verbatim{{else}}question-text{{/if}}" style="white-space: pre-line;">{{.text}}</p>
        </div>
      {{/each}}
      {{#if chatBusy}}
        <p class="loading">thinking…</p>
      {{/if}}
      {{#if !chatDone}}
        <div class="sweep-actions" style="flex-wrap: wrap; margin-top: 0.75rem;">
          <textarea value="{{chatInput}}" placeholder="In your own words…" style="flex: 2; min-height: 5rem;" disabled="{{chatBusy}}"></textarea>
        </div>
        <div class="sweep-actions" style="margin-top: 0.4rem;">
          <button class="btn btn-primary" on-click="@this.sendChat()" disabled="{{chatBusy || !chatInput.trim()}}">Send</button>
          <span class="spacer"></span>
          {{#if card.rawAnswers.length}}
            <button class="btn btn-quiet" on-click="@this.wrapChat()" disabled="{{chatBusy}}">That's everything — wrap up</button>
          {{/if}}
        </div>
      {{/if}}
    </section>

    {{#if submitMessage}}<div class="banner banner-safe">{{submitMessage}}</div>{{/if}}
    {{#if submitError}}<div class="banner banner-warn">{{submitError}}</div>{{/if}}

    <div class="submit-bar">
      <span class="muted" style="font-size: var(--text-sm);">
        Every word you send is saved as you go. When you send it in, the app turns your words into lines for you to check.
      </span>
      <span class="spacer"></span>
      <button class="btn btn-primary" on-click="@this.submitCard()" disabled="{{!canSubmit}}">Send it in</button>
    </div>
  {{else}}
  {{#if card.createdViaShellBy}}
    <p class="capture-shell-note">
      Your lead started this card with just the name and the date. Everything else is yours to write.
    </p>
  {{/if}}

  {{#if capsContext && capsContext.tasks.length}}
    <div class="context-strip">
      <div class="context-title">From CAPS — memory only, never evidence</div>
      {{#if capsContext.tenure}}
        <div class="note" style="margin-bottom: 0.4rem;">CAPS shows you on this project {{fmtDate(capsContext.tenure.from)}} – {{fmtDate(capsContext.tenure.to)}} — does that match?</div>
      {{/if}}
      <ul>
        {{#each capsContext.tasks}}
          <li><span class="meta">{{fmtDate(.date)}}</span> {{.taskName}}{{#if .category}} <span class="meta">· {{.category}}</span>{{/if}}</li>
        {{/each}}
      </ul>
      <div class="note">Just to jog your memory. Only what you write below counts.</div>
    </div>
  {{/if}}

  {{#if context.length}}
    <div class="context-strip">
      <div class="context-title">Your past cards — just for reference</div>
      <ul>
        {{#each context}}
          <li><strong>{{.subject.name}}</strong> <span class="meta">{{.periodTag}} · {{.claims.length}} claims confirmed</span></li>
        {{/each}}
      </ul>
      <div class="note">Nothing is copied in. Only what you write now counts.</div>
    </div>
  {{/if}}

  <div class="form-row">
    <label class="field">
      <span class="field-name">{{#if card.subject.kind === 'account'}}Account{{else}}Project{{/if}} name</span>
      <input type="text" value="{{subjectName}}" placeholder="Name it as you go" />
    </label>
    <label class="field">
      <span class="field-name">Close date</span>
      <input type="date" value="{{closeDateStr}}" />
      {{#if card.periodTag}}<span class="field-hint">Counts under <strong>{{card.periodTag}}</strong> — the quarter the work ended.</span>{{/if}}
    </label>
  </div>

  <div class="section-label">The four questions</div>
  <div class="question-list">
    {{#each questions}}
      <div class="question-block">
        <span class="question-number">{{@index + 1}} / 4</span>
        <div class="question-text">{{this}}</div>
      </div>
    {{/each}}
  </div>
  <p class="any-language">Answer in any language — English, Filipino, Taglish. Whatever tells it best.</p>

  <div class="mode-toggle" role="group" aria-label="Answer mode">
    <button class="{{#if mode === 'guided'}}active{{/if}}" on-click="@this.setMode('guided')">Guided — one at a time</button>
    <button class="{{#if mode === 'single-pass'}}active{{/if}}" on-click="@this.setMode('single-pass')">One go — tell it all at once</button>
  </div>

  {{#if mode === 'guided'}}
    {{#each questions}}
      {{#if @index <= guidedIndex}}
        <div class="question-block">
          <span class="question-number">{{@index + 1}} / 4</span>
          <div class="question-text">{{this}}</div>
          <textarea value="{{answers[@index]}}" placeholder="In your own words…"></textarea>
        </div>
      {{/if}}
    {{/each}}
    {{#if guidedIndex < 3}}
      <button class="btn btn-secondary" on-click="@this.nextQuestion()">Next question</button>
    {{/if}}
  {{else}}
    <div class="question-block">
      <div class="question-text">All four, in one go</div>
      <textarea value="{{singleText}}" rows="10" style="min-height: 14rem;"
        placeholder="Write it like you'd tell a teammate. Just cover the four questions."></textarea>
    </div>
  {{/if}}

  {{#if sweepVisible}}
    <div class="sweep-panel">
      <h2>One last thing</h2>
      <p class="sweep-hint">
        Anything else you own here that didn't come up?
        “Not me” is a fine answer. It costs you nothing.
        If you say yes to something, add one detail — what, where, since when. A bare yes can't become a claim.
        {{#if !track.competencyOrDomainList.length}}
          <br /><span class="meta">The full checklist shows up once the pack is loaded.</span>
        {{/if}}
      </p>
      <textarea value="{{sweepText}}" placeholder="Anything else — or “not me”"></textarea>
      <div class="sweep-actions">
        <button class="btn btn-secondary" on-click="@this.notMe()">Nothing else — not me</button>
      </div>
    </div>
  {{/if}}

  {{#if submitMessage}}
    <div class="banner banner-safe">{{submitMessage}}</div>
  {{/if}}
  {{#if submitError}}
    <div class="banner banner-warn">{{submitError}}</div>
  {{/if}}

  <div class="submit-bar">
    <span class="muted" style="font-size: var(--text-sm);">
      Your words save as you type. The app turns them into lines. You check every line before anything moves.
    </span>
    <span class="spacer"></span>
    <button class="btn btn-primary" on-click="@this.submitCard()" disabled="{{!canSubmit}}">Send it in</button>
  </div>
  {{/if}}
</script>
