<script id="tpl-admin" type="text/ractive">
  <header class="topbar">
    <div class="topbar-inner">
      <span class="wordmark">OLYMPUS <span class="sub">· ADMIN</span></span>
      <span class="topbar-spacer"></span>
      {{#if me}}
        <span class="whoami">
          {{me.name}}
          {{#each me.roles}}<span class="role-chip">{{this}}</span>{{/each}}
        </span>
        <a href="/">Ledger</a>
        <button class="linkish" on-click="@this.logout()">Sign out</button>
      {{/if}}
    </div>
  </header>
  <main class="wrap">
    {{#if error}}<div class="error-note">{{error}}</div>{{/if}}
    {{#if notice}}<div class="banner banner-safe">{{notice}}</div>{{/if}}

    <div class="capture-head"><h1>Administration</h1></div>
    <p class="muted" style="font-size: var(--text-sm); margin-bottom: 1rem;">
      Users, tracks, and the log. No one writes verdicts here — not even you.
    </p>

    <section>
      <div class="section-label">Tracks</div>
      {{#each tracks}}
        <div class="pack-panel">
          <h3>{{.label}} <span class="meta">({{.key}})</span></h3>
          {{#if .vocabPackVersion}}
            <span class="meta">Vocabulary pack {{.vocabPackVersion}}{{#if .packMode === 'vocab-only'}} · vocab-only{{/if}}</span>
          {{else}}
            <span class="pending">NO PACK LOADED — cards wait until one is in</span>
          {{/if}}
          {{#if .packMode === 'vocab-only'}}
            {{#if .behaviorSpecVersion}}
              <span class="meta"> · behavior spec {{.behaviorSpecVersion}}</span>
            {{else}}
              <span class="pending">NO BEHAVIOR SPEC — cards wait until it is in</span>
            {{/if}}
          {{/if}}
          <div class="record-meta" style="margin-top: 0.5rem;">
            <span class="tag">{{#if .calibrationMode}}calibration ON{{else}}calibration off{{/if}}</span>
            <span>{{.questionSet.length}} fixed questions</span>
          </div>
          <div class="form-row" style="margin-top: 0.75rem;">
            <label class="field">
              <span class="field-name">Backup reviewer (gets stuck cards)</span>
              <select value="{{.fallbackReviewerId}}">
                <option value="">not set</option>
                {{#each ~/activeUsers}}
                  <option value="{{._id}}">{{.name}}</option>
                {{/each}}
              </select>
            </label>
            <label class="field">
              <span class="field-name">Exposure checker (signs off picks)</span>
              <select value="{{.exposureVerifierId}}">
                <option value="">not set</option>
                {{#each ~/activeUsers}}
                  <option value="{{._id}}">{{.name}}</option>
                {{/each}}
              </select>
            </label>
            <button class="btn btn-secondary" style="align-self: flex-end;" on-click="@this.saveSettings(this)">Save settings</button>
          </div>
          <p class="muted" style="font-size: var(--text-xs); margin-top: 0.4rem;">
            Set here, not in code. A backup reviewer never gets a card where they are the talent, the pick, or part of the disagreement.
          </p>
        </div>
      {{/each}}
    </section>

    <section>
      <div class="section-label">Pending verdicts <span class="count">{{pendingVerdicts.length}}</span></div>
      {{#if pendingVerdicts.length}}
        <div class="table-scroll">
          <table class="ledger">
            <thead>
              <tr><th>Card</th><th>Talent</th><th>Reviewer</th><th>Status</th><th>Aging</th><th>Chases</th><th>Streak</th><th></th></tr>
            </thead>
            <tbody>
              {{#each pendingVerdicts}}
                <tr>
                  <td>{{.subject.name}}</td>
                  <td class="meta">{{.talentName}}</td>
                  <td class="meta">{{.reviewerName}}{{#if .escalated}} <span class="tag">fallback</span>{{/if}}</td>
                  <td class="meta">{{statusLabel(.status)}}</td>
                  <td class="meta">{{.agingWorkingDays}}wd</td>
                  <td class="meta">{{.chases}}</td>
                  <td class="meta">{{#if .repeatStreak >= 3}}<span style="color: var(--amber-ink);">{{.repeatStreak}}×</span>{{else}}{{.repeatStreak}}×{{/if}}</td>
                  <td><button class="btn btn-quiet" on-click="@this.nudgeCard(this)">Nudge</button></td>
                </tr>
                {{#if .escalationHalted}}
                  <tr><td colspan="8"><span class="pending">STUCK — {{.escalationHalted.reason}}. Fix the backup-reviewer setting, or sort it by hand.</span></td></tr>
                {{/if}}
                {{#if .status === 'deadlocked'}}
                  <tr>
                    <td colspan="8">
                      <div class="sweep-actions" style="flex-wrap: wrap;">
                        <span class="muted" style="font-size: var(--text-xs); width: 100%;">
                          Both sides are saved in the card's log. Your ruling guides — it never decides. The reviewer re-checks with it in view.
                        </span>
                        <input type="text" value="{{.rulingText}}" placeholder="Your take, one or two lines" style="flex: 2;" />
                        <button class="btn btn-primary" on-click="@this.sendRuling(this)">Write ruling</button>
                      </div>
                    </td>
                  </tr>
                {{/if}}
              {{/each}}
            </tbody>
          </table>
        </div>
        <p class="muted" style="font-size: var(--text-xs); margin-top: 0.5rem;">
          Rule: 10 working days. Two auto reminders, then the card moves to the backup reviewer. Silence never becomes a verdict.
        </p>
      {{else}}
        <div class="empty-state">Nothing pending a verdict.</div>
      {{/if}}
    </section>

    <section>
      <div class="section-label">Calibration queue <span class="count">{{calibration.length}}</span></div>
      {{#if calibration.length}}
        {{#each calibration}}
          <article class="record">
            <div class="record-head">
              <span class="record-subject">{{.subject.name}}</span>
            </div>
            <div class="record-meta">
              <span class="tag">{{.periodTag}}</span>
              <span>{{.track}}</span>
              <span>pack {{.packVersion}}</span>
              <span>{{.claims.length}} claims</span>
            </div>

            {{#each .claims}}
              <div style="border-top: 1px solid var(--rule); padding-top: 0.75rem; margin-top: 0.75rem;">
                <div class="record-meta" style="margin-bottom: 0.4rem;">
                  <strong style="color: var(--ink); font-family: var(--sans);">{{.competencyOrDomain}}</strong>
                  {{#each .labels:field}}<span class="tag">{{field}}: {{this}}</span>{{/each}}
                  {{#each .flags}}<span class="tag" style="color: var(--amber-ink);">{{this}}</span>{{/each}}
                </div>
                <p class="verbatim">“{{.sourceQuote}}”</p>
                <div class="sweep-actions">
                  <input type="text" value="{{.editLabels}}" placeholder='fixes, e.g. execution: I run it'
                    style="flex: 2; font-family: var(--mono); font-size: var(--text-xs);" />
                  <button class="btn btn-secondary" on-click="@this.correctClaim(../../this, this)">Save correction</button>
                  <button class="btn btn-danger" on-click="@this.removeClaim(../../this, this)">Remove claim</button>
                </div>
              </div>
            {{/each}}

            <div class="record-foot">
              <span class="muted" style="font-size: var(--text-xs);">Fixes are checked against the pack and logged.</span>
              <span class="spacer"></span>
              <button class="btn btn-primary" on-click="@this.releaseCard(this)">Release to talent</button>
            </div>
          </article>
        {{/each}}
      {{else}}
        <div class="empty-state">
          Nothing waiting. While calibration is on, new cards stop here first. Five clean cards in a row, across three talents, ends calibration.
        </div>
      {{/if}}
    </section>

    <section>
      <div class="section-label">Add a user</div>
      <div class="shell-form">
        <div class="form-row">
          <label class="field">
            <span class="field-name">Name</span>
            <input type="text" value="{{newUser.name}}" />
          </label>
          <label class="field">
            <span class="field-name">Frost email</span>
            <input type="text" value="{{newUser.email}}" placeholder="name@frostdesigngroup.com" />
          </label>
        </div>
        <div class="form-row">
          <label class="field">
            <span class="field-name">Roles</span>
            <span style="display: flex; gap: 1rem; padding-top: 0.4rem;">
              {{#each roleOptions}}
                <label style="display: inline-flex; gap: 0.35rem; align-items: center; font-size: var(--text-sm);">
                  <input type="checkbox" name="{{newUser.roles}}" value="{{this}}" /> {{this}}
                </label>
              {{/each}}
            </span>
          </label>
          <label class="field">
            <span class="field-name">Track</span>
            <select value="{{newUser.track}}">
              <option value="">none</option>
              <option value="ops">ops</option>
              <option value="artasset">artasset</option>
            </select>
          </label>
          <label class="field">
            <span class="field-name">Lead</span>
            <select value="{{newUser.leadId}}">
              <option value="">none</option>
              {{#each leads}}
                <option value="{{._id}}">{{.name}}</option>
              {{/each}}
            </select>
          </label>
        </div>
        <button class="btn btn-primary" on-click="@this.addUser()"
          disabled="{{!newUser.name || !newUser.email}}">Add user</button>
      </div>
    </section>

    <section>
      <div class="section-label">Users <span class="count">{{users.length}}</span></div>
      <div class="table-scroll">
        <table class="ledger">
          <thead>
            <tr><th>Name</th><th>Email</th><th>Roles</th><th>Track</th><th>Status</th><th></th></tr>
          </thead>
          <tbody>
            {{#each users}}
              <tr>
                <td>{{.name}}</td>
                <td class="meta">{{.email}}</td>
                <td><span class="chip-row">{{#each .roles}}<span class="role-chip">{{this}}</span>{{/each}}</span></td>
                <td class="meta">{{#if .track}}{{.track}}{{else}}—{{/if}}</td>
                <td class="meta">{{#if .active}}active{{else}}inactive{{/if}}</td>
                <td>
                  <button class="btn btn-quiet" on-click="@this.toggleActive(this)">
                    {{#if .active}}Deactivate{{else}}Reactivate{{/if}}
                  </button>
                </td>
              </tr>
            {{/each}}
          </tbody>
        </table>
      </div>
    </section>

    <section>
      <div class="section-label">Audit trail <span class="count">latest {{audit.length}}</span></div>
      <div class="table-scroll">
        <table class="ledger">
          <thead>
            <tr><th>When</th><th>Action</th><th>Entity</th></tr>
          </thead>
          <tbody>
            {{#each audit}}
              <tr>
                <td class="meta">{{fmtDate(.createdAt)}}</td>
                <td class="meta">{{.action}}</td>
                <td class="meta">{{.entity}}</td>
              </tr>
            {{/each}}
          </tbody>
        </table>
      </div>
      <p class="muted" style="font-size: var(--text-xs); margin-top: 0.5rem;">
        Write-once. Never edited, never deleted.
      </p>
    </section>
  </main>
</script>
